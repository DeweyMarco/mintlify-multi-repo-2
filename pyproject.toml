[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dijkstra-service"
version = "1.0.0"
description = "Dijkstra's shortest-path algorithm with a FastAPI interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dijkstra_service"]
